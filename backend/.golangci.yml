# Konfigurasi golangci-lint.
#
# Keputusan penting di file ini: TIDAK semua linter diaktifkan.
#
# Repo ini punya sejumlah besar kode yang sudah ter-commit dan belum bersih
# untuk linter tertentu. Mengaktifkan semuanya lalu membiarkan CI merah bukan
# pilihan yang baik - orang akan mematikan linter atau berhenti memeriksa CI
# sama sekali. Karena itu linter diaktifkan secara bertahap:
#
#   AKTIF (lolos bersih, menangkap bug nyata):
#     govet        - deteksi race, printf-mismatch, shadow, unreachable.
#     staticcheck  - kondisi mati, perbandingan redundan, API usang.
#     ineffassign  - penugasan variabel yang langsung ditimpa (dead store).
#
#   TERTUNDA (menunggu pembersihan terpisah):
#     errcheck     - error tidak dicek. Sekarang menemukan ~15 temuan,
#                    mayoritas false positive pada builder pattern
#                    apperror.WithField (yang mengembalikan receiver yang
#                    sama setelah di-mutasi, jadi tidak ada error yang
#                    hilang). Perlu penyesuaian pola kodenya, bukan sekadar
#                    menambah pengecualian.
#     unused       - menemukan 6 fungsi helper mati di store.
#     revive       - menemukan komentar exported yang tidak sesuai format.
#
# Setiap linter yang ditunda akan diaktifkan begitu pembersihannya selesai,
# di commit yang sama dengan perbaikannya. Menunda dengan catatan tertulis
# lebih baik daripada mematikan senyap.
#
# Catatan soal gofumpt dan Windows: gofumpt kini AKTIF sebagai formatter.
# Dulu dikira "75 file belum diformat" - ternyata itu sebagian besar artefak
# CRLF: `core.autocrlf=true` menyimpan working tree sebagai CRLF sementara
# git menyimpan blob-nya sebagai LF, jadi formatter yang membaca working tree
# melaporkan hampir semua file hanya karena akhir baris. Setelah diukur
# dengan konten LF yang sudah dinormalisasi, file yang BENAR-BENAR belum
# diformat cuma 13, dan ke-13nya sudah dibersihkan.
#
# Karena CI berjalan di ubuntu (git checkout mengeluarkan LF), formatter di CI
# melihat bentuk yang benar. Di Windows, jalankan lewat pre-commit hook yang
# memeriksa blob staged (LF), bukan working tree.

version: "2"

linters:
  default: none
  enable:
    - govet
    - staticcheck
    - ineffassign

  settings:
    govet:
      enable-all: true
      disable:
        # Fieldalignment mengubah urutan struct agar hemat memori. Pada
        # aplikasi seukuran ini nilainya kecil, dan churn-nya membuat diff
        # sulit dibaca.
        - fieldalignment
        # Shadow menandai `if err := ...` yang mendeklarasikan err baru di
        # dalam blok. Itu idiom Go yang lazim dan aman, tapi govet
        # melaporkannya sebagai temuan. Menerjemahkannya semua hanya
        # menambah noise tanpa menangkap bug nyata.
        - shadow

  exclusions:
    rules:
      # Hasil generate sqlc. Tidak ditulis tangan.
      - path: internal/dbgen/
        linters:
          - unused
          - staticcheck

formatters:
  enable:
    - gofumpt

run:
  timeout: 5m
  tests: true
