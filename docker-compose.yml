name: paymentreceipt-v2

services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      APP_ENV: development
      APP_BASE_URL: http://localhost:8088
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: 8080
      DB_URL: ${DOCKER_DB_URL:?set DOCKER_DB_URL in the root .env file}
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:?set AUTH_JWT_SECRET in the root .env file}
      AUTH_COOKIE_SECURE: "false"
      LOG_FORMAT: json
      AI_BASE_URL: ${AI_BASE_URL:-https://smartsproxy.clouad/v1}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL_RECEIPT: ${AI_MODEL_RECEIPT:-gemini-3.8-flash-high}
    extra_hosts:
      - host.docker.internal:host-gateway
    restart: unless-stopped
    networks:
      - app

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-8088}:8080"
    restart: unless-stopped
    networks:
      - app

networks:
  app:
    driver: bridge
