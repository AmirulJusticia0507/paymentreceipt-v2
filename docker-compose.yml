name: paymentreceipt-v2

services:
  # Migrasi skema dijalankan sebagai langkah terpisah SEBELUM aplikasi start.
  # Service ini berhenti setelah selesai (one-shot); compose menunggu exit code 0
  # sebelum memulai api berkat depends_on.condition: service_completed_successfully.
  # Strategi ini memastikan aplikasi tidak pernah berjalan dengan skema yang
  # belum sesuai dengan kodenya.
  migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile
    # ENTRYPOINT default image adalah binary api; override untuk binary migrasi.
    entrypoint: ["/app/paymentreceipt-migrate", "up"]
    environment:
      DB_URL: ${DOCKER_DB_URL:?set DOCKER_DB_URL in the root .env file}
      LOG_FORMAT: json
      LOG_LEVEL: info
    extra_hosts:
      - host.docker.internal:host-gateway
    restart: "no"
    networks:
      - app

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      APP_ENV: development
      APP_BASE_URL: http://localhost:8088
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: 8080
      DB_URL: ${DOCKER_DB_URL:?set DOCKER_DB_URL in the root .env file}
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:?set AUTH_JWT_SECRET in the root .env file}
      AUTH_COOKIE_SECURE: "false"
      LOG_FORMAT: json
      AI_BASE_URL: ${AI_BASE_URL:-https://smartsproxy.clouad/v1}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL_RECEIPT: ${AI_MODEL_RECEIPT:-gemini-3.8-flash-high}
    extra_hosts:
      - host.docker.internal:host-gateway
    restart: unless-stopped
    networks:
      - app

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-8088}:8080"
    restart: unless-stopped
    networks:
      - app

networks:
  app:
    driver: bridge
