name: paymentreceipt-v2

services:
  # Migrasi skema dijalankan sebagai langkah terpisah SEBELUM aplikasi start.
  # Service ini berhenti setelah selesai (one-shot); compose menunggu exit code 0
  # sebelum memulai api berkat depends_on.condition: service_completed_successfully.
  # Strategi ini memastikan aplikasi tidak pernah berjalan dengan skema yang
  # belum sesuai dengan kodenya.
  migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile
    # ENTRYPOINT default image adalah binary api; override untuk binary migrasi.
    entrypoint: ["/app/paymentreceipt-migrate", "up"]
    environment:
      DB_URL: ${DOCKER_DB_URL:?set DOCKER_DB_URL in the root .env file}
      LOG_FORMAT: json
      LOG_LEVEL: info
    extra_hosts:
      - host.docker.internal:host-gateway
    restart: "no"
    networks:
      - app

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    depends_on:
      migrate:
        condition: service_completed_successfully
    # HEALTHCHECK sudah didefinisikan di Dockerfile (binary api dengan flag
    # -healthcheck); nilai berikut menimpanya dengan interval yang lebih
    # agresif untuk review lokal supaya statusnya cepat terlihat.
    healthcheck:
      test: ["CMD", "/app/paymentreceipt-api", "-healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    environment:
      APP_ENV: development
      APP_BASE_URL: http://localhost:8088
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: 8080
      DB_URL: ${DOCKER_DB_URL:?set DOCKER_DB_URL in the root .env file}
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:?set AUTH_JWT_SECRET in the root .env file}
      AUTH_COOKIE_SECURE: "false"
      LOG_FORMAT: json
      AI_BASE_URL: ${AI_BASE_URL:-https://smartsproxy.clouad/v1}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL_RECEIPT: ${AI_MODEL_RECEIPT:-gemini-3.8-flash-high}
    extra_hosts:
      - host.docker.internal:host-gateway
    restart: unless-stopped
    networks:
      - app

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    depends_on:
      api:
        condition: service_healthy
    # nginx:alpine menyertakan busybox wget. Probe lewat /healthz yang di-proxy
    # ke api, jadi "sehat" berarti benar-benar rantai nginx -> api -> response
    # berfungsi - bukan cuma proses nginx hidup.
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
    ports:
      - "${WEB_PORT:-8088}:8080"
    restart: unless-stopped
    networks:
      - app

networks:
  app:
    driver: bridge
