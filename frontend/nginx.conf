# Akses log terstruktur (JSON) ke stdout.
#
# Satu baris JSON per request supaya agregator (Loki, ELK, CloudWatch, dsb.)
# bisa langsung mem-parse field tanpa regex. $request_id (32 hex, dihasilkan
# nginx) diteruskan ke backend sebagai X-Request-ID - backend memakai nilai
# yang sama untuk log aplikasinya, jadi satu request tercatat dengan ID yang
# sama di log edge dan log aplikasi (korelasi langsung).
#
# escape=json men-escape nilai variabel supaya karakter istimewa di URL/user
# agent tidak merusak struktur JSON.
log_format json_access escape=json
    '{"time":"$time_iso8601",'
    '"request_id":"$request_id",'
    '"remote_addr":"$remote_addr",'
    '"method":"$request_method",'
    '"host":"$host",'
    '"path":"$uri",'
    '"query":"$args",'
    '"status":$status,'
    '"bytes_sent":$bytes_sent,'
    '"duration_s":$request_time,'
    '"upstream_status":"$upstream_status",'
    '"user_agent":"$http_user_agent",'
    '"referer":"$http_referer"}';

access_log /dev/stdout json_access;

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Korelasi log: request ID yang sama dipakai di access log nginx dan
        # log aplikasi backend.
        proxy_set_header X-Request-ID $request_id;
    }

    location = /healthz {
        proxy_pass http://api:8080/healthz;
        proxy_set_header X-Request-ID $request_id;
    }

    location = /readyz {
        proxy_pass http://api:8080/readyz;
        proxy_set_header X-Request-ID $request_id;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:css|js|woff2|svg|png|jpg|jpeg|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
