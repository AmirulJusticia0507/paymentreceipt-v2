name: CI

# Jalankan pada setiap push dan pull request.
#
# Workflow ini ada karena dua kali commit yang build-nya rusak sempat
# mencapai main. Kedua-duanya tidak terdeteksi karena tidak ada yang
# menjalankan build secara otomatis. Build yang rusak di main membuat setiap
# pekerjaan berikutnya dimulai dari keadaan yang tidak bisa dikompilasi.
#
# Job backend, frontend, dan security berjalan paralel: keduanya independen,
# jadi tidak ada alasan untuk menunggu satu sama lain.
#
# Aturan untuk step di sini: sebuah step yang dilaporkan "Lint" tapi
# diakhiri `|| true` TIDAK bisa gagal - CI selalu hijau dan orang akan
# percaya padahal tidak ada yang diperiksa. Kalau sebuah pemeriksaan belum
# siap jadi gerbang, tulis eksplisit bahwa dia informasional. Jangan
# menyamarkan gerbang yang mati.

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: paymentreceipt_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d paymentreceipt_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/paymentreceipt_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true
      - name: Build
        working-directory: backend
        run: go build ./...
      - name: Tests
        working-directory: backend
        run: go test -race ./...
      - name: Database integration tests
        working-directory: backend
        run: go test -race -tags=integration ./integration
      # Versi dipasang tetap, bukan @latest: hasil CI harus bisa direproduksi.
      # @latest bisa tiba-tiba menarik versi linter baru yang melaporkan temuan
      # pada kode yang tidak berubah, dan sulit dibedakan dari regresi nyata.
      #
      # Step ini juga menangkap format: di golangci-lint v2, gofumpt adalah
      # formatter yang dijalankan oleh `golangci-lint run`, jadi file yang
      # belum diformat membuat step ini gagal. Lihat T11.6.
      - name: Lint
        working-directory: backend
        run: |
          curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/v2.14.0/install.sh | sh -s -- -b $(go env GOPATH)/bin v2.14.0
          golangci-lint run

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Type check
        working-directory: frontend
        run: npm run build
      # Gerbang lint yang SEBENARNYA. `npm run lint` memakai --max-warnings
      # di package.json: peringatan masih diizinkan (biar tidak memblokir
      # pengembangan), tapi satu pun error akan membuat job ini merah.
      #
      # Sebelumnya step ini ditulis `npx eslint src || true` - bentuk yang
      # tidak pernah bisa gagal, sehingga centang hijau di CI tidak
      # berarti apa pun.
      - name: Lint
        working-directory: frontend
        run: npm run lint
      # Gerbang format. Prettier sudah dipakai untuk memformat seluruh src,
      # jadi sekarang tinggal dijaga. Langkah ini bukan hiasan: saat pertama
      # kali diaktifkan, ia menemukan beberapa file yang isinya dirapatkan
      # menjadi satu baris (banyak pernyataan dalam satu baris, tanpa spasi
      # di sekitar operator) - gaya yang tidak mungkin dibaca atau ditinjau.
      - name: Format
        working-directory: frontend
        run: npx prettier --check "src/**/*.{ts,vue,css}"
      # Sengaja TIDAK dijadikan gerbang, dan ini bukan kecelakaan: saat
      # ditulis, `npm audit` melaporkan 4 temuan high yang semuanya ada di
      # rantai devDependencies (alat build), bukan kode yang dijalankan di
      # production. Memasang `|| true` di sini TAPI melabelinya jujur lebih
      # baik daripada menghapus `|| true` sehingga CI merah permanen untuk
      # masalah yang belum bisa diselesaikan sekarang.
      #
      # Saat temuan itu tertangani, hapus `|| true` supaya langkah ini
      # menjadi gerbang sungguhan.
      - name: Audit (informational, bukan gerbang)
        working-directory: frontend
        run: npm audit --audit-level=high || true

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - name: Vulnerability scan
        working-directory: backend
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
