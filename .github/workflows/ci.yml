name: CI

# Jalankan pada setiap push dan pull request.
#
# Workflow ini ada karena dua kali commit yang build-nya rusak sempat
# mencapai main. Kedua-duanya tidak terdeteksi karena tidak ada yang
# menjalankan build secara otomatis. Build yang rusak di main membuat setiap
# pekerjaan berikutnya dimulai dari keadaan yang tidak bisa dikompilasi.
#
# Job frontend dan backend berjalan paralel: keduanya independen, jadi tidak
# ada alun untuk menunggu satu sama lain.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    # Catatan: service postgres belum dipasang. Saat ini seluruh test backend
    # adalah unit test dengan stub dan tidak membuka koneksi database, jadi
    # service itu hanya memperlambat CI dan menambah titik gagal. Service ini
    # dipasang kembali saat T11.4 menambahkan integration test yang benar-benar
    # butuh database.

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache-dependency-path: backend/go.sum

      - name: go build
        run: go build ./...

      - name: go vet
        run: go vet ./...

      - name: golangci-lint
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest
          golangci-lint run ./...

      # Catatan: pengecekan format gofumpt belum diaktifkan di CI. Sebagian
      # besar tree belum diformat gofumpt, dan memaksakannya di sini hanya
      # akan membuat CI merah sejak awal. Pembersihan format dikerjakan
      # terpisah (lihat T11.6), lalu step ini ditambahkan kembali.

      - name: go test
        run: go test ./... -count=1

      - name: go test -race
        run: go test ./... -count=1 -race

  frontend:
    name: Frontend (Vue)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: npm ci
        run: npm ci

      # vue-tsc mengetikkan seluruh codebase. Tanpa step ini, error tipe baru
      # diketahui hanya saat orang membuka filenya di editor.
      - name: type-check + build
        run: npm run build
